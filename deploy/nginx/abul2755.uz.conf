# ==========================================
# BOZOR DISTRIBUTOR - NGINX PRODUCTION CONFIG
# Domen: abul2755.uz
# ==========================================

# Brute-force hujumlaridan himoyalanish uchun login so'rovlarini cheklash (1 daqiqada 5 ta so'rov)
limit_req_zone $binary_remote_addr zone=distributor_login_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=distributor_api_limit:10m rate=30r/s;

# 1. HTTP -> HTTPS Avtomatik Yo'naltirish
server {
    listen 80;
    listen [::]:80;
    server_name abul2755.uz www.abul2755.uz;

    # Let's Encrypt SSL sertifikat tekshiruvi uchun
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Asosiy Xavfsiz Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name abul2755.uz www.abul2755.uz;

    # SSL Sertifikatlar (Let's Encrypt Certbot tomonidan yaratiladi)
    ssl_certificate /etc/letsencrypt/live/abul2755.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/abul2755.uz/privkey.pem;

    # Zamonaviy xavfsiz SSL protokollari va shifrlari
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling (Telefonlarda SSL tekshiruvini zudlik bilan server orqali o'tkazish)
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/abul2755.uz/chain.pem;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # www.abul2755.uz -> abul2755.uz avtomatik yo'naltirish
    if ($host = 'www.abul2755.uz') {
        return 301 https://abul2755.uz$request_uri;
    }

    # Xavfsizlik sarlavhalari (Security Headers)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Texnik ishlar (Maintenance mode) tekshiruvi:
    # Agar /var/www/maintenance/maintenance.enable fayli mavjud bo'lsa, to'liq texnik ishlar sahifasiga o'tadi
    if (-f /var/www/maintenance/maintenance.enable) {
        return 503;
    }
    error_page 503 =200 @maintenance;
    location @maintenance {
        root /var/www/maintenance;
        try_files /index.html =200;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    }

    # Fayl yuklash hajmi (50MB - Zaxira fayllarni yuklash uchun)
    client_max_body_size 50M;

    # GZIP Siqish (Yuklanish tezligini 4-5 barobar oshiradi)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Login sahifasiga tez-tez so'rov yuborishdan (parol tanlashdan) himoya
    location = /login {
        limit_req zone=distributor_login_limit burst=5 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Barcha asosiy sahifalar va API so'rovlar
    location / {
        limit_req zone=distributor_api_limit burst=50 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # WebSocket / PWA Service Worker kesh sozlamalari
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Service Worker va Manifest hech qachon brauzerda qotib qolmasligi kerak
    location ~* (service-worker\.js|manifest\.json)$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    }

    # Statik fayllarni brauzer darajasida keshlashtirish
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}
