<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Texnik ishlar | Bozor Distributor</title>
    <meta name="theme-color" content="#090D16">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        body {
            background-color: #090D16;
            color: #F8FAFC;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            background-image: 
                radial-gradient(circle at 50% 10%, rgba(59, 130, 246, 0.12) 0%, transparent 60%),
                radial-gradient(circle at 80% 90%, rgba(16, 185, 129, 0.08) 0%, transparent 50%);
        }
        .card {
            background: #111827;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            max-width: 440px;
            width: 100%;
            padding: 36px 24px;
            text-align: center;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #3B82F6, #10B981, #6366F1);
        }
        .icon-box {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px auto;
            border-radius: 22px;
            background: rgba(59, 130, 246, 0.12);
            border: 1px solid rgba(59, 130, 246, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #60A5FA;
            animation: pulse-glow 3s infinite alternate ease-in-out;
        }
        @keyframes pulse-glow {
            0% {
                transform: scale(0.98);
                box-shadow: 0 0 15px rgba(59, 130, 246, 0.2);
            }
            100% {
                transform: scale(1.04);
                box-shadow: 0 0 35px rgba(59, 130, 246, 0.45);
            }
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 700;
            background: rgba(245, 158, 11, 0.14);
            color: #FBBF24;
            border: 1px solid rgba(245, 158, 11, 0.3);
            padding: 4px 12px;
            border-radius: 999px;
            margin-bottom: 18px;
            letter-spacing: 0.3px;
        }
        .badge-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #FBBF24;
            animation: blink 1.4s infinite ease-in-out;
        }
        @keyframes blink {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
        h1 {
            font-size: 23px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 12px;
            color: #FFFFFF;
        }
        p {
            font-size: 14.5px;
            line-height: 1.6;
            color: #94A3B8;
            margin-bottom: 28px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px 20px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            background: linear-gradient(135deg, #2563EB, #1D4ED8);
            color: #FFFFFF;
            border: none;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);
            transition: all 0.2s ease;
            text-decoration: none;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .footer-note {
            margin-top: 24px;
            font-size: 12px;
            color: #64748B;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon-box">
            <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path>
            </svg>
        </div>

        <div class="badge">
            <span class="badge-dot"></span>
            TEXNIK YANGILANISH
        </div>

        <h1>Dasturda ishlar olib borilmoqda</h1>
        <p>Hozirda tizimda yangi funksiyalar va imkoniyatlar qo'shish bo'yicha texnik ishlar olib borilmoqda.<br><br>Dastur tez orada to'liq yangilangan holda ishga tushiriladi.</p>

        <button class="btn" onclick="window.location.reload()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="23 4 23 10 17 10"></polyline>
                <polyline points="1 20 1 14 7 14"></polyline>
                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
            </svg>
            <span>Qayta tekshirish</span>
        </button>

        <div class="footer-note">
            Bozor Distributor Platformasi &bull; 2026
        </div>
    </div>
</body>
</html>
