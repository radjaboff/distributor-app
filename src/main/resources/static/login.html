<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Kirish — Bozor Distributor</title>
    <link rel="manifest" href="manifest.json?v=3">
    <meta name="theme-color" content="#070A11">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-v2-192.png">
    <link rel="apple-touch-icon" href="icons/icon-v2-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #070A11;
            color: #F8FAFC;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 16px;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(37, 99, 235, 0.22) 0%, transparent 60%),
                radial-gradient(circle at 100% 100%, rgba(16, 185, 129, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 0% 80%, rgba(99, 102, 241, 0.12) 0%, transparent 50%);
            background-attachment: fixed;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            position: relative;
        }

        .login-card {
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 26px;
            padding: 36px 26px 30px 26px;
            box-shadow: 
                0 25px 50px -12px rgba(0, 0, 0, 0.7),
                0 0 0 1px rgba(255, 255, 255, 0.05),
                0 0 40px rgba(37, 99, 235, 0.12);
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #3B82F6 0%, #10B981 50%, #6366F1 100%);
        }

        /* 3D Glass Logo Container */
        .login-logo-wrapper {
            position: relative;
            width: 82px;
            height: 82px;
            margin: 0 auto 20px auto;
        }

        .login-logo-glow {
            position: absolute;
            inset: -4px;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.6), rgba(16, 185, 129, 0.4));
            border-radius: 26px;
            filter: blur(14px);
            opacity: 0.6;
            animation: pulse-aura 3.5s infinite alternate ease-in-out;
        }

        @keyframes pulse-aura {
            0% { opacity: 0.45; transform: scale(0.96); }
            100% { opacity: 0.8; transform: scale(1.04); }
        }

        .login-logo {
            position: relative;
            width: 82px;
            height: 82px;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #090D16;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            overflow: hidden;
        }

        .login-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Sarlavhalar */
        .login-header {
            text-align: center;
            margin-bottom: 26px;
        }

        .login-title-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .login-title {
            font-size: 23px;
            font-weight: 800;
            color: #FFFFFF;
            letter-spacing: -0.5px;
        }

        .pro-badge {
            font-size: 10.5px;
            font-weight: 800;
            background: rgba(59, 130, 246, 0.18);
            color: #60A5FA;
            border: 1px solid rgba(59, 130, 246, 0.4);
            padding: 2px 7px;
            border-radius: 7px;
            letter-spacing: 0.6px;
            text-transform: uppercase;
        }

        .login-subtitle {
            font-size: 13.5px;
            color: #94A3B8;
            line-height: 1.45;
        }

        /* Xatolik xabari */
        .login-error {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.35);
            color: #FCA5A5;
            padding: 12px 14px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 9px;
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }

        /* Form Guruhlari va Inputlar */
        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 700;
            color: #CBD5E1;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            color: #64748B;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            transition: color 0.2s ease;
        }

        .form-input {
            width: 100%;
            height: 50px;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            padding: 0 14px 0 44px;
            color: #FFFFFF;
            font-size: 15px;
            font-weight: 500;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-input:focus {
            background: rgba(15, 23, 42, 0.95);
            border-color: #3B82F6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.22);
        }

        .form-input:focus + .input-icon,
        .input-wrapper:focus-within .input-icon {
            color: #60A5FA;
        }

        .toggle-password-btn {
            position: absolute;
            right: 12px;
            background: transparent;
            border: none;
            color: #64748B;
            padding: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            transition: color 0.2s ease;
        }

        .toggle-password-btn:hover {
            color: #CBD5E1;
        }

        /* Eslab qolish */
        .remember-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 6px;
            margin-bottom: 22px;
        }

        .custom-checkbox {
            display: flex;
            align-items: center;
            gap: 9px;
            cursor: pointer;
            user-select: none;
        }

        .custom-checkbox input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #2563EB;
            cursor: pointer;
            border-radius: 5px;
        }

        .custom-checkbox span {
            font-size: 13.5px;
            font-weight: 500;
            color: #94A3B8;
        }

        /* Asosiy Tugma */
        .submit-btn {
            width: 100%;
            height: 52px;
            background: linear-gradient(135deg, #2563EB 0%, #1D4ED8 100%);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            color: #FFFFFF;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.2px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            box-shadow: 0 10px 25px -4px rgba(37, 99, 235, 0.45);
            transition: all 0.2s ease;
        }

        .submit-btn:hover {
            background: linear-gradient(135deg, #1D4ED8 0%, #1E40AF 100%);
            transform: translateY(-1px);
            box-shadow: 0 14px 28px -4px rgba(37, 99, 235, 0.55);
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        /* Pastki xavfsizlik imzosi */
        .footer-info {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: #64748B;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .footer-info svg {
            color: #10B981;
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="login-card">
        <!-- 3D Sapfir Logo -->
        <div class="login-logo-wrapper">
            <div class="login-logo-glow"></div>
            <div class="login-logo">
                <img src="icons/icon-v2-192.png" alt="Bozor Distributor" width="82" height="82">
            </div>
        </div>

        <!-- Sarlavhalar -->
        <div class="login-header">
            <div class="login-title-row">
                <h1 class="login-title">Bozor Distributor</h1>
                <span class="pro-badge">PRO</span>
            </div>
            <p class="login-subtitle">Ulgurji savdo va hisob-kitob daftari</p>
        </div>

        <!-- Xatolik xabari (noto'g'ri login/parol kiritilganda) -->
        <div id="errorBox" class="login-error" style="display:none;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span>Login yoki parol noto'g'ri kiritildi</span>
        </div>

        <form method="POST" action="/login" id="loginForm" onsubmit="handleLoginSubmit(event)">
            <!-- Login Input -->
            <div class="form-group">
                <label class="form-label" for="usernameInput">
                    <span>Login</span>
                </label>
                <div class="input-wrapper">
                    <span class="input-icon">
                        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </span>
                    <input type="text" class="form-input" id="usernameInput" name="username" placeholder="Loginni kiriting" required autofocus autocomplete="username">
                </div>
            </div>

            <!-- Parol Input -->
            <div class="form-group">
                <label class="form-label" for="passwordInput">
                    <span>Parol</span>
                </label>
                <div class="input-wrapper">
                    <span class="input-icon">
                        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                    </span>
                    <input type="password" class="form-input" id="passwordInput" name="password" placeholder="Parolni kiriting" required autocomplete="current-password" style="padding-right: 48px;">
                    <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility()" aria-label="Parolni ko'rsatish/yashirish" title="Parolni ko'rsatish">
                        <svg id="eyeIcon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Eslab qolish -->
            <div class="remember-row">
                <label class="custom-checkbox">
                    <input type="checkbox" name="remember-me" id="rememberMe" checked>
                    <span>Meni eslab qol (30 kun)</span>
                </label>
            </div>

            <!-- Kirish Tugmasi -->
            <button type="submit" class="submit-btn" id="submitBtn">
                <span>Tizimga kirish</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </button>
        </form>

        <div class="footer-info">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            </svg>
            <span>Xavfsiz va shifrlangan tizim &bull; 2026</span>
        </div>
    </div>
</div>

<script>
    // Xatolik xabarini tekshirish
    if (window.location.search.includes('error')) {
        document.getElementById('errorBox').style.display = 'flex';
    }

    // Parolni ko'rsatish/yashirish funksiyasi
    function togglePasswordVisibility() {
        const passInput = document.getElementById('passwordInput');
        const eyeIcon = document.getElementById('eyeIcon');
        if (passInput.type === 'password') {
            passInput.type = 'text';
            eyeIcon.innerHTML = `
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
            `;
        } else {
            passInput.type = 'password';
            eyeIcon.innerHTML = `
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
            `;
        }
    }

    // Tugma bosilganda animatsiya
    function handleLoginSubmit(e) {
        const btn = document.getElementById('submitBtn');
        btn.style.opacity = '0.85';
        btn.innerHTML = `
            <svg class="spinner" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="animation: spin 0.8s linear infinite;">
                <circle cx="12" cy="12" r="10" stroke-opacity="0.25"></circle>
                <path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round"></path>
            </svg>
            <span>Tekshirilmoqda...</span>
        `;
    }
</script>
<style>
    @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }
</style>
</body>
</html>
