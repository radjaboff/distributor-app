<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bozor Distributor</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#090D16">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Distributor">
    <link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="icons/icon-512.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <!-- Zamonaviy va o'qilishi oson shriftlar: Plus Jakarta Sans, Outfit, Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,500;0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=12">
</head>
<body>
<div id="networkStatus" class="network-badge" style="display:none;">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block; vertical-align:-2px; margin-right:4px;"><line x1="1" y1="1" x2="23" y2="23"></line><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path><path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path><path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path><line x1="12" y1="20" x2="12.01" y2="20"></line></svg>
    <span>Internet aloqasi yo'q (Oflayn)</span>
</div>

<header class="app-bar">
    <!-- Chap tomon: Logo va Orqaga (Qizil doira) -->
    <div class="app-bar__left">
        <button class="app-bar__back" id="backBtn" style="visibility:hidden;" aria-label="Orqaga">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <button id="appProfileBtn" class="brand-avatar-btn" onclick="showAppProfileModal()" title="Profil va Tizim" aria-label="Profil va Tizim">
            <div class="brand-avatar-badge">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                    <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                    <line x1="12" y1="22.08" x2="12" y2="12"></line>
                </svg>
                <span class="online-indicator"></span>
            </div>
        </button>
    </div>

    <!-- O'rta tomon: Bo'lim nomi (Yashil doira) -->
    <div class="app-bar__center">
        <div class="app-bar__title-row">
            <h1 class="app-bar__title" id="pageTitle">Bozorlar</h1>
            <span class="app-bar__glow-pill" id="pageTitleBadge">PRO</span>
        </div>
        <div class="app-bar__subtitle" id="pageSubtitle">Savdo nuqtalari va do'konlar</div>
    </div>

    <!-- O'ng tomon: Ekranga chiqarish (Ko'k doira) -->
    <div class="app-bar__right">
        <button id="pwaInstallBtn" class="header-icon-btn pwa-install-btn" onclick="handlePwaInstallClick()" title="Ekranga o'rnatish" aria-label="Ekranga o'rnatish">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="5" y="2" width="14" height="20" rx="2.5" ry="2.5"></rect>
                <path d="M12 7v6"></path>
                <path d="M9 10l3 3 3-3"></path>
                <circle cx="12" cy="18" r="0.8" fill="currentColor"></circle>
            </svg>
        </button>
    </div>
</header>

<main class="content" id="content">
    <div class="loading"><div class="spinner"></div></div>
</main>

<div id="toastContainer" class="toast-container"></div>

<button class="fab" id="fabBtn" style="display:none;" aria-label="Qo'shish">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
</button>

<nav class="bottom-nav">
    <button class="bottom-nav__item active" id="navBozorlar" onclick="goToTab('bozorlar')">
        <span class="bottom-nav__icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        </span>
        <span>Bozorlar</span>
    </button>
    <button class="bottom-nav__item" id="navMahsulotlar" onclick="goToTab('mahsulotlar')">
        <span class="bottom-nav__icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
        </span>
        <span>Mahsulotlar</span>
    </button>
    <button class="bottom-nav__item" id="navDashboard" onclick="goToTab('dashboard')">
        <span class="bottom-nav__icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
        </span>
        <span>Hisobot</span>
    </button>
    <button class="bottom-nav__item" id="navProfil" onclick="showAppProfileModal()">
        <span class="bottom-nav__icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        </span>
        <span>Profil</span>
    </button>
</nav>

<script src="js/app.js?v=29"></script>

<script>
    if ('serviceWorker' in navigator) {
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!refreshing) {
                refreshing = true;
                window.location.reload();
            }
        });

        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/service-worker.js')
                .then((registration) => {
                    registration.update();
                    console.log('Service Worker ro\'yxatdan o\'tdi va yangilanishlar tekshirildi');
                })
                .catch((err) => console.error('Service Worker xatosi:', err));
        });
    }
</script>

<!-- PDF Chop etish va Akt Sverka konteyneri (Faqat chop etilganda ko'rinadi) -->
<div id="printStatementContainer"></div>
<div id="statementModal"></div>

</body>
</html>
