spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:distributor_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
# 1-Admin foydalanuvchi (Environment Variables orqali boshqariladi)
app.security.user1.username=${APP_USERNAME:admin}
app.security.user1.password=${APP_PASSWORD}

# 2-Admin foydalanuvchi (Ixtiyoriy 2-admin)
app.security.user2.username=${APP_USER2_USERNAME:}
app.security.user2.password=${APP_USER2_PASSWORD:}

# Remember-me tokeni uchun maxfiy shifrlash kaliti
app.security.remember-me.key=${REMEMBER_ME_KEY:distributor-app-secure-salt-key-928374}

# Cookie va CSRF himoyasi (Brauzer darajasida begona saytlar so'rovini to'sish)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Faol sessiya muddati: 24 soat (Remember-me esa 30 kun saqlanadi, server xotirasi tejaladi)
server.servlet.session.timeout=1440m
spring.jackson.time-zone=Asia/Tashkent

# HTTP Javoblarni GZIP siqish (Tarmoq yukini 80% kamaytiradi, tezlikni oshiradi)
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# HikariCP ulanishlar hovuzi (PostgreSQL bilan bog'lanish doim faol turadi)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# Statik resurslarni keshlashtirish
spring.web.resources.cache.period=3600
spring.web.resources.chain.cache=true

# Multipart fayl yuklash hajmi (Zaxira nusxalarni tiklash uchun 50MB)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Nginx Reverse Proxy va HTTPS mosligi (SSL orqali to'g'ri ishlashi uchun)
server.forward-headers-strategy=framework

server.port=${PORT:8080}