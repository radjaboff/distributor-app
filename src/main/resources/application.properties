spring.datasource.url=jdbc:postgresql://localhost:5432/distributor_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
app.security.username=${APP_USERNAME}
app.security.password=${APP_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.servlet.session.timeout=43200m
spring.jackson.time-zone=Asia/Tashkent

server.port=8080